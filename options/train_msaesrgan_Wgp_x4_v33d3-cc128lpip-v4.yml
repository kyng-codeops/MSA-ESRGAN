# general settings
name: MSA-ESRGAN-Wgp_x4_ip14v33-d3-cc128lpip-v4
model_type: RealESRGANModel
scale: 4
num_gpu: auto  # auto: can infer from your visible devices automatically. official: 4 GPUs
manual_seed: 0

# ----------------- options for synthesizing training data in RealESRGANModel ----------------- #
# USM the ground-truth
l1_gt_usm: True
percep_gt_usm: True
gan_gt_usm: False

# the first degradation process
resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.65  # increased from 0.5 for older sensor simulation
# gaussian_noise_prob: 0.5  # original @0k
noise_range: [1, 40]  # widened: low end for modern sensors, high end for older sensors
# noise_range: [1, 30]  # original @0k
poisson_scale_range: [0.05, 4.5]  # widened: low end for modern sensors, high end for older shot noise
# poisson_scale_range: [0.05, 3]  # original @0k
gray_noise_prob: 0.5  # increased from 0.4 for older sensor simulation
jpeg_range: [15, 95]  # widened: low end for heavy compression, high end for modern quality

# the second degradation process
second_blur_prob: 0.9    # Increase from 0.8 to 0.9
resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.6  # increased from 0.5 for older sensor simulation
# gaussian_noise_prob2: 0.5  # original @0k
noise_range2: [1, 35]  # widened: low end for modern sensors, high end for older sensors
# noise_range2: [1, 25]  # original @0k
poisson_scale_range2: [0.05, 4]  # widened: low end for modern sensors, high end for older shot noise
# poisson_scale_range2: [0.05, 2.5]  # original @0k
gray_noise_prob2: 0.5  # increased from 0.4 for older sensor simulation
# gray_noise_prob2: 0.4  # original @0k
jpeg_range2: [15, 95]  # widened: low end for heavy compression, high end for modern quality

# fake upscale degradation - simulates cheap SD-to-HD stretching (e.g., 480->720/1080, 320->480)
fake_upscale_prob: 0.15  # probability to apply fake upscale degradation
fake_upscale_range: [1.5, 2.25]  # upscale factor range (1.5x = 480->720, 2.25x = 480->1080)
fake_upscale_modes: ['bilinear', 'bicubic', 'nearest']  # cheap interpolation methods
fake_upscale_mode_weights: [0.45, 0.45, 0.1]  # bilinear/bicubic common, nearest rare but exists

# combing artifact degradation - simulates poor deinterlacing with residual comb lines
combing_prob: 0.1  # probability to apply combing artifacts (keep low, ~10%)
combing_strength: [0.5, 2.0]  # horizontal pixel shift range for odd scanlines
combing_blend: 0.3  # blend factor with adjacent lines (0 = pure shift, higher = more ghosting)

gt_size: 256
queue_size: 180

batch_size_per_gpu: 5  # Changed from 4

datasets:
  train:
    name: iphone14+4kv33
    type: RealESRGANDataset
    dataroot_gt: datasets/ds_root
    # meta_info: datasets/ds_root/meta_info/meta_info_iphone14+4kv2_multiscale.txt
    meta_info: datasets/ds_root/meta_info/meta_info_ip14v33.txt

    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 4.5]  # Increase upper bound from 3 to 4.5 for more blur
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 2.5]  # Increase upper bound from 1.5 to 2.5
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 256  # Changed from 320
    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 5
    batch_size_per_gpu: 5  # Changed from 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
    name: validation
    type: PairedImageDataset
    dataroot_gt: datasets/ds_root/validation/hq2
    # dataroot_lq: datasets/ds_root/validation/lq2_786k
    dataroot_lq: datasets/ds_root/validation/lq2_auto_85
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

network_d:
  type: UNetDiscriminator
  num_in_ch: 3
  num_feat: 128  # Keep at 128 for discriminator balance
  skip_connection: True

# path
path:
  # When using "auto_resume", for iteration zero the pretrain_network_g is used, otherwise
  # this BasicSR framework will just use the hightest iteration cound net_g, net_d, and state files

  # pretrain_network_g: experiments/pretrained_models/ESRnet_ip14v3_g_2950000.pth  # Real-ESRNet ip14+4kv3 using jpg dmg [15, 95]
  # pretrain_network_g: experiments/pretrained_models/ESRnet_ip14v33_320gt_dmgV2_2995K.pth

  # ESRNet finetuned with new degradation pipeline
  pretrain_network_g: experiments/ESRNet_finetune_newdeg/models/net_g_421000.pth

  param_key_g: params_ema
  strict_load_g: true

  # pretrain_network_d: ~

  param_key_d: params_ema
  strict_load_d: true

  # Resume from iter 8420 (right before generator training starts) with corrected LPIPS weight
  resume_state: ~
  # experiments/MSA-ESRGAN-Wgp_x4_ip14v33-d3-cc128lpip-v4/training_states/8420.state

  # Auto resume from cli just uses last net_g, net_d, and state files. Learning rates
  # are sealed into the state file as are all optimizer schedules.
  # as a result auto_resume will ignore yaml reconfigs on lr and milestones.

  # To keep training progress use the specific net_g, net_d without a state file
  # and mak70k, @119e modifications to lr and/or milestones as needed. Iteration count
  # will be reset to 0 and the optimizers will be reinitialized with new lr and
  # milestones if changed. Name the yaml as a series to help organize
  # tensorboard visuals since the charts are really just off-set continuations
  # of the original training run using a series of yml configs.
  # This is the same process for finetuning with pretrained networks but
  # different because the dataset hasn't changed.
  # Note: the --auto_resume flat is not used (unless a run is being interrupted
  # to check-in on progress using a test set).  Resuming from a specific point
  # would also not need the --auto_resume flag (since you specify the net_g,
  # and state file). Once a state file is specified, net_d will be inferred so
  # no need to specify net_d.  The cli --auto_resume flag just ignores the
  # pretrain_network_g parameter and uses the latest net_g and state file.


# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 2.000e-5
    weight_decay: 0
    betas: [0.0, 0.99]

  optim_d:
    type: Adam
    lr: 1.000e-4 # Start at 5x the generator lr
    weight_decay: 0
    betas: [0.0, 0.99]   # beta1=0 disables Adam momentum
    # eps: 1e-8
  scheduler:
    type: MultiStepLR
    # Changes to lr and milestones do not natively work with resume since the
    # optimizer initial lr sched calc is held in mem and re-saved at each state.
    # Use the update_states.py script to modify state files to update LR
    # between restarts.
    # PyTorch milestons are epochs, BasicSR are iterations.
    milestones: [1684000]
    gamma: 0.5

  # A dry-run will compute iterations per epoch.
  # Example, ip14+4kv3.2 dataset is 3802 iterations per epoch
  # Example, ip14v33 dataset is 4210 iterations per epoch

  total_iter: 1684000  # 400 epochs for ip14v33 dataset
  warmup_iter: 4210

  net_d_iters: 10  # Run at 10 or higher for critic to compete
  # @5 the generator beats it so often it's almost like it gives-up,
  # d_gap shows convergence but falls below 5e-4 by iter 9k
  # gradients become very small by iter 20k needing big scale-up multiples.
  # It seems like scaling up even higher wgan weights that early (500, 300, 600)
  # in training probably confuses the training?
  # But then again, that run did not have a long net_d_init_iters period.

  # Using 2 full epochs (1 epoch with LR warmup) and 1 at full LR helped.
  #
  # @10 d_gap stays above 5e-4 until ~80k iters has has a more smooth fall-off
  # and the remaining decay looks smooth and healthy through 200k iters without
  # changing wgan weights.  d_gap starts to cross into small positive values
  # by 230k but does get pushed back to -3.xe-2 frequently.

  net_d_init_iters: 8420  # 2 full epochs, 1 with warmup and 2nd at full LR

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.00
    reduction: mean

  # v4: LPIPS perceptual loss - replaces perceptual_opt + grad_opt
  # Benefits: Better detail preservation, no over-smoothing, no scratchy artifacts
  lpips_opt:
    type: LPIPSLoss
    loss_weight: 4.0  # Increased from 3.0 to account for volatility during weight training
    net_type: vgg
    use_dropout: true
    reduction: mean
    # pretrained_path: ~  # Optional: use pretrained LPIPS weights for better initialization

  # v3a: Removed GV loss to check boarder noise @50.5k iters to test possible scratch-correlation
  # grad_opt:
  #   type: GradientVarianceLoss
  #   loss_weight: 0.02125 # very nonlinear @.125 get .14 to .35, @.005 get 4.7e-3
  #   # @0.02125 ~4.24x0.005 est to scale peaks to 0.02
  #   reduction: mean

  # v3a: VGG perceptual loss caused over-smoothing, replaced by LPIPS in v4
  # perceptual_opt:
  #   type: PerceptualLoss
  #   layer_weights:
  #     # before relu
  #     'conv1_2': 0.1
  #     'conv2_2': 0.1
  #     'conv3_4': 1
  #     'conv4_4': 1
  #     'conv5_4': 1
  #   vgg_type: vgg19
  #   use_input_norm: true
  #   perceptual_weight: 0.007 # Old run .005 to .0065 @277k, this run .0065 @167k
  #   style_weight: 0
  #   range_norm: false
  #   criterion: l1

  # gan loss - non-relativistic WGAN (fixes negative l_g_gan issue)
  gan_opt:
    type: GANLoss
    gan_type: wgan
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 94.0

  # Gradient penalty weight for WGAN-GP (applied in model code)
  # Reduced from 5.0 to 3.0 to strengthen discriminator signal (d_gap was very small, l_g_gan weak)
  gp_lambda: 3.0

# Uncomment these for validation
# validation settings
val:
  val_freq: 4210
  save_img: False

  metrics:
    lpips:
      type: calculate_lpips
      crop_border: 4
    niqe:
      type: calculate_niqe
      crop_border: 4
    # Removed PSNR/SSIM - poor correlation with perceptual quality
    # psnr:
    #   type: calculate_psnr
    #   crop_border: 4
    #   test_y_channel: false
    # ssim:
    #   type: calculate_ssim
    #   crop_border: 4
    #   test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: 4210
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
