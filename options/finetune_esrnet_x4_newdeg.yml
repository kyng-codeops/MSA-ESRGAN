# ESRNet Fine-tune with New Degradation Pipeline
# Fine-tunes existing ESRNet to learn the new fake upscale and combing degradations
# Use this output as pretrain_network_g for GAN training with the new pipeline
# Based on train_realesrnet_x4cust.yml

# general settings
name: ESRNet_finetune_newdeg
model_type: RealESRNetModel
scale: 4
num_gpu: auto
manual_seed: 0

# ----------------- options for synthesizing training data in RealESRNetModel ----------------- #
gt_usm: True  # USM the ground-truth

# the first degradation process
resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.65  # increased for older sensor simulation
noise_range: [1, 40]  # widened: modern clean to older noisy sensors
poisson_scale_range: [0.05, 4.5]  # widened: modern to vintage shot noise
gray_noise_prob: 0.5
jpeg_range: [15, 95]  # widened: heavy compression to modern quality

# the second degradation process
second_blur_prob: 0.9
resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.6
noise_range2: [1, 35]  # widened: modern to older sensors
poisson_scale_range2: [0.05, 4]  # widened: modern to vintage shot noise
gray_noise_prob2: 0.5
jpeg_range2: [15, 95]  # widened: heavy compression to modern quality

# fake upscale degradation - simulates cheap SD-to-HD stretching (e.g., 480->720/1080, 320->480)
fake_upscale_prob: 0.15  # probability to apply fake upscale degradation
fake_upscale_range: [1.5, 2.25]  # upscale factor range (1.5x = 480->720, 2.25x = 480->1080)
fake_upscale_modes: ['bilinear', 'bicubic', 'nearest']  # cheap interpolation methods
fake_upscale_mode_weights: [0.45, 0.45, 0.1]  # bilinear/bicubic common, nearest rare

# combing artifact degradation - simulates poor deinterlacing with residual comb lines
combing_prob: 0.1  # probability to apply combing artifacts
combing_strength: [0.5, 2.0]  # horizontal pixel shift range for odd scanlines
combing_blend: 0.3  # blend factor with adjacent lines

gt_size: 320
queue_size: 600  # Increased for more diversity (600/10 = 60 batches in queue)

# dataset and data loader settings
datasets:
  train:
    name: iphone14+4kv33
    type: RealESRGANDataset
    dataroot_gt: datasets/ds_root
    meta_info: datasets/ds_root/meta_info/meta_info_ip14v33.txt

    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 4.5]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 2.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 320
    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 6  # Increased to keep up with larger batch
    batch_size_per_gpu: 10  # Increased from 5 (using ~22GB VRAM)
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: validation
    type: PairedImageDataset
    dataroot_gt: datasets/ds_root/validation/hq2
    dataroot_lq: datasets/ds_root/validation/lq2_786k
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

# path
path:
  # Start from existing ESRNet checkpoint trained with old degradation pipeline
  pretrain_network_g: experiments/pretrained_models/ESRnet_ip14v33_320gt_dmgV2_2995K.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 5e-5  # Lower LR for fine-tuning (original was ~1e-4)
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    # Fine-tune schedule: reduce LR at ~48 epochs, ~95 epochs
    milestones: [100000, 200000]
    gamma: 0.5

  # Fine-tune for 300k iterations (~142 epochs with ip14v33 dataset at 2105 iter/epoch with batch=10)
  total_iter: 300000
  warmup_iter: -1  # No warmup needed for fine-tuning (model already well-trained)

  # losses - L1 only (same as original ESRNet training)
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: 2105  # Validate every epoch (ip14v33 = 2105 iter/epoch with batch=10)
  save_img: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: 4210  # Save every 2 epochs to save disk space
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
