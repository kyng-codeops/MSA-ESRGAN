# general settings
name: MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3ns1b
model_type: RealESRGANModel
scale: 4
num_gpu: auto  # auto: can infer from your visible devices automatically. official: 4 GPUs
manual_seed: 0

# ----------------- options for synthesizing training data in RealESRGANModel ----------------- #
# USM the ground-truth
l1_gt_usm: True
percep_gt_usm: True
gan_gt_usm: False

# the first degradation process
resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1, 30]
poisson_scale_range: [0.05, 3]
gray_noise_prob: 0.4
jpeg_range: [30, 85]

# the second degradation process
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1, 25]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30, 95]

gt_size: 320
queue_size: 360   # sys-mon says 10 of 30.5 iGB used so 1.56x inc in gt_sz works
batch_size_per_gpu: 5

datasets:
  train:
    name: iphone14+4kv3
    type: RealESRGANDataset
    dataroot_gt: datasets/ds_root
    meta_info: datasets/ds_root/meta_info/meta_info_iphone14+4kv2_multiscale.txt
    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 4]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 2]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 320
    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 5
    batch_size_per_gpu: 5
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
    name: validation
    type: PairedImageDataset
    dataroot_gt: datasets/ds_root/validation/hq2
    dataroot_lq: datasets/ds_root/validation/lq2_786k
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

network_d:
  type: UNetDiscriminator
  num_in_ch: 3
  num_feat: 64
  skip_connection: True

# path
path:
  # When using "auto_resume", for iteration zero the pretrain_network_g is used, otherwise
  # this BasicSR framework will just use the hightest iteration cound net_g, net_d, and state files

  # pretrain_network_g: experiments/pretrained_models/ESRnet_ip14v3_g_2950000.pth  # Real-ESRNet ip14+4kv3 using jpg dmg [15, 95]
  pretrain_network_g: experiments/MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3ns1a/models/net_g_85000.pth
  # pretrain_network_g: null
  param_key_g: params_ema
  strict_load_g: true
  # pretrain_network_d: experiments/MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3g/models/net_d_260000.pth
  # pretrain_network_d: experiments/MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3h/models/net_d_65000.pth
  # pretrain_network_d: experiments/MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3i/models/net_d_390000.pth
  #
  # The above are from transfer training of the discriminator after
  # modifying the architecture to relativistic Wasserstein with gradient penalty.
  # The complexity of the new discriminator needed to be built-up significantly
  # as shown by the generator loss overpowering the discriminator loss.
  # pretrain_network_d: experiments/pretrained_models/ip14v32-gvWgp3j_net_d_3815000.pth
  # The above net_d was trained before Unet skip connections were added in
  # addition to the attention blocks native skip-like connections.  The added
  # skips seem to greatly improve results reducing high-frequency artifacts.
  pretrain_network_d: experiments/MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3ns1a/models/net_d_85000.pth

  # If a continuation run is needed where lr or milestones change use the
  # finetune method below.  This will reset the iteration count to 0 because
  # you would be throwing away the state file. Only other option is to edit
  # the state file which is more advanced than current capabilities.
  # pretrain_network_d: experiments/MSA-ESRraGANx4plus_ip14+4kv3.2gvWgp3ls/models/net_d_xxx000.pth

  param_key_d: params_ema
  strict_load_d: true

  resume_state: ~

  # Auto resume from cli just uses last net_g, net_d, and state files. Learning rates
  # are sealed into the state file as are all optimizer schedules.
  # as a result auto_resume will ignore yaml reconfigs on lr and milestones.

  # To keep training progress use the specific net_g, net_d without a state file
  # and make modifications to lr and/or milestones as needed. Iteration count
  # will be reset to 0 and the optimizers will be reinitialized with new lr and
  # milestones if changed. Name the yaml as a series to help organize
  # tensorboard visuals since the charts are really just off-set continuations
  # of the original training run using a series of yml configs.
  # This is the same process for finetuning with pretrained networks but
  # different because the dataset hasn't changed.
  # Note: the --auto_resume flat is not used (unless a run is being interrupted
  # to check-in on progress using a test set).  Resuming from a specific point
  # would also not need the --auto_resume flag (since you specify the net_g,
  # and state file). Once a state file is specified, net_d will be inferred so
  # no need to specify net_d.  The cli --auto_resume flag just ignores the
  # pretrain_network_g parameter and uses the latest net_g and state file.


# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 6.25e-6
    weight_decay: 0
    betas: [0.5, 0.99]
  optim_d:
    type: Adam
    lr: !!float 1.25e-5
    weight_decay: 0
    betas: [0.0, 0.99]   # beta1=0 disables Adam momentum
    # eps: 1e-8
  scheduler:
    type: MultiStepLR
    # Changes to lr and milestones do not work with resume because the
    # optimizer reads when the run is initiated saves in the state file.
    # any restart/resume reads from the state file and ignores the yaml.
    # PyTorch milestons are epochs, but in BasicSR these are iterations
    # to relate to epochs, dry-run will output how many iterations per epoch.
    # ip14+4kv3.2 dataset is 3802 iterations per epoch
    milestones: [400000]
    gamma: 0.5

  total_iter: 1755000 # epoch 506
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  grad_opt:
    type: GradientVarianceLoss
    loss_weight: 1.0
    reduction: mean
  # perceptual loss (content and stylecompressor losses)
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      # before relu
      'conv1_2': 0.1
      'conv2_2': 0.1
      'conv3_4': 1
      'conv4_4': 1
      'conv5_4': 1
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: !!float 1.0
    style_weight: 0
    range_norm: false
    criterion: l1
  # gan loss
  gan_opt:
    type: RelativisticAverageGANLoss
    loss_type: wgan-gp
    gp_lambda: 20
    loss_weight: 0.15

  net_d_iters: 1 # 3j net_d very pretrained gets overconfident w/sm lr
  net_d_init_iters: 1 # keep since adding skip connections to net_d

# Uncomment these for validation
# validation settings
val:
  val_freq: !!float 5e3
  save_img: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
